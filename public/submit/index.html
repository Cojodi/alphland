<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Submit Your dApp - Alphland</title>
    <style>
      /* Intro banner */
      .submit-intro-banner {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 9999;
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        border-bottom: 1px solid #2a2a4a;
        padding: 20px 32px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .submit-intro-banner h1 {
        color: #fff;
        font-size: 20px;
        font-weight: 600;
        margin: 0 0 6px;
      }
      .submit-intro-banner p {
        color: #a0a0b0;
        font-size: 14px;
        margin: 0 0 12px;
        line-height: 1.5;
      }
      .submit-intro-checklist {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .submit-intro-checklist li {
        background: #23233a;
        border: 1px solid #333355;
        border-radius: 6px;
        color: #c0c0d8;
        font-size: 13px;
        padding: 4px 10px;
      }
      .submit-intro-checklist li::before {
        content: '✓ ';
        color: #6366f1;
        font-weight: 700;
      }
      /* Push CMS content below the banner */
      #nc-root {
        margin-top: 130px;
      }

      /* Hide navigation elements that allow browsing other entries */
      [href="#/collections/dapps"],
      [data-testid="list-card"],
      .css-1hwfws3,
      a[href*="#/collections/dapps/"]:not([href*="/new"]) {
        display: none !important;
      }

      /* Success page styles */
      .success-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10000;
      }
      .success-card {
        background: #1e1e2e;
        border-radius: 16px;
        padding: 48px;
        max-width: 500px;
        text-align: center;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        border: 1px solid #333;
      }
      .success-icon {
        width: 80px;
        height: 80px;
        background: linear-gradient(135deg, #00c853 0%, #00e676 100%);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 24px;
      }
      .success-icon svg {
        width: 40px;
        height: 40px;
        color: white;
      }
      .success-title {
        color: #fff;
        font-size: 24px;
        font-weight: 600;
        margin-bottom: 12px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .success-message {
        color: #a0a0a0;
        font-size: 16px;
        line-height: 1.6;
        margin-bottom: 24px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .pr-link {
        display: inline-block;
        background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
        color: white;
        text-decoration: none;
        padding: 14px 28px;
        border-radius: 8px;
        font-weight: 500;
        font-size: 15px;
        transition: transform 0.2s, box-shadow 0.2s;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .pr-link:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4);
      }
      .back-link {
        display: block;
        margin-top: 20px;
        color: #6366f1;
        text-decoration: none;
        font-size: 14px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .back-link:hover {
        text-decoration: underline;
      }
      .loading-spinner {
        width: 20px;
        height: 20px;
        border: 2px solid #333;
        border-top-color: #6366f1;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto 16px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <script>
      window.CMS_MANUAL_INIT = true;
      // Store referrer for back link
      window.referrerUrl = document.referrer || '/';
    </script>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

    <script>
      // Branch for dApp submissions - always use testing branch
      const targetBranch = 'testing';

      // Store dApp data for PR lookup
      let lastDappData = null;

      // Full CMS configuration (no config.yml loading)
      CMS.init({
        config: {
          load_config_file: false,
          backend: {
            name: 'github',
            repo: 'alph-land/alphland',
            branch: targetBranch,
            base_url: window.location.origin,
            auth_endpoint: 'api/auth',
            open_authoring: true,
            commit_messages: {
              create: 'Add dApp: {{fields.name}}',
              update: 'Update dApp: {{fields.name}}',
              openAuthoring: '{{message}}',
            },
          },
          publish_mode: 'editorial_workflow',
          media_folder: 'public/dapps',
          public_folder: '/dapps',
          collections: [
            {
              name: 'dapps',
              label: 'dApps',
              label_singular: 'dApp',
              folder: 'data',
              create: true,
              slug: '{{slug}}',
              extension: 'json',
              format: 'json',
              editor: { preview: false },
              fields: [
                { label: 'Name', name: 'name', widget: 'string', required: true },
                { label: 'Description', name: 'description', widget: 'text', required: true, hint: 'Full description of your dApp (2-3 sentences)' },
                { label: 'Short Description', name: 'short_description', widget: 'string', required: true, hint: 'Brief tagline (max 60 characters)' },
                { label: 'Tags', name: 'tags', widget: 'select', multiple: true, required: true, options: ['Mining', 'Tools', 'Infrastructure', 'Bridges', 'Analytics', 'Wallets', 'DeFi', 'Security', 'Onramps', 'Games', 'Quests', 'NFTs', 'Ai', 'Education', 'Social', 'ComingSoon'] },
                {
                  label: 'Links', name: 'links', widget: 'object', fields: [
                    { label: 'Website', name: 'website', widget: 'string', required: true },
                    { label: 'Careers Page', name: 'careers', widget: 'string', required: false, hint: 'URL or mailto:email' },
                    { label: 'Twitter', name: 'twitter', widget: 'string', required: false },
                    { label: 'Telegram', name: 'telegram', widget: 'string', required: false },
                    { label: 'Discord', name: 'discord', widget: 'string', required: false },
                    { label: 'Documentation', name: 'docs', widget: 'string', required: false },
                    { label: 'GitHub', name: 'github', widget: 'string', required: false },
                    { label: 'YouTube', name: 'youtube', widget: 'string', required: false },
                    { label: 'Medium', name: 'medium', widget: 'string', required: false },
                    { label: 'Mirror', name: 'mirror', widget: 'string', required: false },
                    { label: 'LinkedIn', name: 'linkedin', widget: 'string', required: false },
                  ]
                },
                { label: 'Twitter Username', name: 'twitterName', widget: 'string', required: false, hint: 'Without @ symbol' },
                {
                  label: 'Team Information', name: 'teamInfo', widget: 'object', fields: [
                    { label: 'Contact Email', name: 'contactEmail', widget: 'string', required: false },
                    { label: 'Founded Date', name: 'founded', widget: 'datetime', required: false, format: 'YYYY-MM-DDTHH:mm:ss.SSSZ' },
                    { label: 'Anonymous Team', name: 'anonymous', widget: 'boolean', default: false },
                  ]
                },
                {
                  label: 'Media', name: 'media', widget: 'object', collapsed: false, fields: [
                    { label: 'Logo', name: 'logoUrl', widget: 'image', required: true, hint: 'Square logo (recommended: 512x512px, WebP format)' },
                    { label: 'Banner', name: 'bannerUrl', widget: 'image', required: true, hint: 'Wide banner (recommended: 1200x400px, WebP format)' },
                    { label: 'Preview Image', name: 'previewUrl', widget: 'image', required: true, hint: 'Screenshot or preview (recommended: 1200x800px, WebP format)' },
                    { label: 'Video URL', name: 'videoUrl', widget: 'string', required: false, hint: 'YouTube or Vimeo URL' },
                    { label: 'Gallery', name: 'gallery', widget: 'list', required: false, field: { label: 'Image', name: 'image', widget: 'image' } },
                  ]
                },
                { label: 'Smart Contracts', name: 'contracts', widget: 'list', required: false, default: [], collapsed: true, fields: [{ label: 'Contract Address', name: 'address', widget: 'string' }, { label: 'Contract Name', name: 'name', widget: 'string' }] },
                { label: 'Audits', name: 'audits', widget: 'list', required: false, default: [], collapsed: true, fields: [{ label: 'Auditor', name: 'auditor', widget: 'string' }, { label: 'Report URL', name: 'url', widget: 'string' }, { label: 'Date', name: 'date', widget: 'datetime' }] },
                { label: 'Tokens', name: 'tokens', widget: 'list', required: false, default: [], collapsed: true, fields: [{ label: 'Token Name', name: 'name', widget: 'string' }, { label: 'Token Symbol', name: 'symbol', widget: 'string' }, { label: 'Token ID', name: 'id', widget: 'string' }] },
                { label: 'NFT Collection', name: 'nft', widget: 'object', required: false, collapsed: true, fields: [{ label: 'Collection Name', name: 'name', widget: 'string', required: false }, { label: 'Collection URL', name: 'url', widget: 'string', required: false }] },
              ],
            },
          ],
        },
      });

      // Register event handlers for CMS
      CMS.registerEventListener({
        name: 'preSave',
        handler: ({ entry }) => {
          // Store dApp data before save
          lastDappData = entry.get('data').toJS();
          console.log('dApp data:', lastDappData);
          return entry.get('data');
        },
      });

      CMS.registerEventListener({
        name: 'postSave',
        handler: ({ entry }) => {
          console.log('dApp saved successfully');
          // Show success page after a short delay to ensure PR is created
          setTimeout(() => showSuccessPage(), 2000);
        },
      });

      // Function to show success page
      function showSuccessPage() {
        // Try to get GitHub username from localStorage (set by CMS)
        const authData = localStorage.getItem('netlify-cms-user');
        let username = '';
        if (authData) {
          try {
            const parsed = JSON.parse(authData);
            username = parsed.login || parsed.name || '';
          } catch (e) {}
        }

        // Get back URL
        const backUrl = window.referrerUrl || '/';

        // Create success overlay
        const overlay = document.createElement('div');
        overlay.className = 'success-overlay';
        overlay.innerHTML = `
          <div class="success-card">
            <div class="success-icon">
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
              </svg>
            </div>
            <h2 class="success-title">dApp Submitted Successfully!</h2>
            <p class="success-message">
              Your dApp has been submitted as a Pull Request. Our team will review it shortly.
            </p>
            <div class="loading-spinner" id="pr-loading"></div>
            <div id="pr-link-container"></div>
            <a href="${backUrl}" class="back-link">← Back</a>
          </div>
        `;
        document.body.appendChild(overlay);

        // Try to find the PR
        findLatestPR(username);
      }

      // Function to find the latest PR created by the user
      async function findLatestPR(username) {
        const container = document.getElementById('pr-link-container');
        const loading = document.getElementById('pr-loading');

        try {
          // Get auth token from CMS
          const authData = localStorage.getItem('netlify-cms-user');
          let token = '';
          if (authData) {
            try {
              const parsed = JSON.parse(authData);
              token = parsed.token || '';
            } catch (e) {}
          }

          if (token) {
            // Search for recent PRs
            const response = await fetch(
              'https://api.github.com/repos/alph-land/alphland/pulls?state=open&sort=created&direction=desc&per_page=5',
              {
                headers: {
                  'Authorization': `token ${token}`,
                  'Accept': 'application/vnd.github.v3+json',
                },
              }
            );

            if (response.ok) {
              const prs = await response.json();
              // Find PR that matches our dApp (created in last 5 minutes)
              const recentPR = prs.find(pr => {
                const createdAt = new Date(pr.created_at);
                const now = new Date();
                const diffMinutes = (now - createdAt) / (1000 * 60);
                return diffMinutes < 5 && (
                  pr.title.includes('Add dApp:') ||
                  pr.title.includes('data/') ||
                  (lastDappData && pr.title.includes(lastDappData.name))
                );
              });

              if (recentPR) {
                loading.style.display = 'none';
                container.innerHTML = `
                  <a href="${recentPR.html_url}" target="_blank" class="pr-link">
                    View Pull Request #${recentPR.number}
                  </a>
                `;

                // Update PR body with dApp details if we have the data
                if (lastDappData && token) {
                  updatePRBody(recentPR.number, token, lastDappData);
                }
                return;
              }
            }
          }

          // Fallback: show link to all PRs
          loading.style.display = 'none';
          container.innerHTML = `
            <a href="https://github.com/alph-land/alphland/pulls" target="_blank" class="pr-link">
              View All Pull Requests
            </a>
          `;
        } catch (error) {
          console.error('Error finding PR:', error);
          loading.style.display = 'none';
          container.innerHTML = `
            <a href="https://github.com/alph-land/alphland/pulls" target="_blank" class="pr-link">
              View All Pull Requests
            </a>
          `;
        }
      }

      // Function to update PR body with dApp details
      async function updatePRBody(prNumber, token, dappData) {
        try {
          const tags = Array.isArray(dappData.tags) ? dappData.tags.join(', ') : (dappData.tags || 'N/A');
          const links = dappData.links || {};

          const body = `## New dApp Submission

**Name:** ${dappData.name || 'N/A'}

**Short Description:** ${dappData.short_description || 'N/A'}

**Description:**
${dappData.description || 'N/A'}

**Tags:** ${tags}

**Website:** ${links.website || 'N/A'}

### Links
| Platform | URL |
|----------|-----|
| Twitter | ${links.twitter || '-'} |
| Discord | ${links.discord || '-'} |
| Telegram | ${links.telegram || '-'} |
| GitHub | ${links.github || '-'} |
| Docs | ${links.docs || '-'} |

### Team Info
- **Contact Email:** ${dappData.teamInfo?.contactEmail || 'Not provided'}
- **Anonymous Team:** ${dappData.teamInfo?.anonymous ? 'Yes' : 'No'}

---
*This dApp was submitted via [Alphland Submit Form](https://alph.land/submit)*`;

          await fetch(
            `https://api.github.com/repos/alph-land/alphland/pulls/${prNumber}`,
            {
              method: 'PATCH',
              headers: {
                'Authorization': `token ${token}`,
                'Accept': 'application/vnd.github.v3+json',
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({ body }),
            }
          );
          console.log('PR body updated successfully');
        } catch (error) {
          console.error('Error updating PR body:', error);
        }
      }

      // WebP conversion + preview fix
      (function() {
        const previewUrls = {}; // filename -> blob URL for local preview

        function convertToWebP(file) {
          return new Promise(function(resolve) {
            const canvas = document.createElement('canvas');
            const img = new Image();
            const url = URL.createObjectURL(file);
            img.onload = function() {
              canvas.width = img.width;
              canvas.height = img.height;
              canvas.getContext('2d').drawImage(img, 0, 0);
              URL.revokeObjectURL(url);
              canvas.toBlob(function(blob) {
                const newName = file.name.replace(/\.[^.]+$/, '.webp');
                const webpFile = new File([blob], newName, { type: 'image/webp' });
                previewUrls[newName] = URL.createObjectURL(blob);
                resolve(webpFile);
              }, 'image/webp', 0.85);
            };
            img.onerror = function() {
              URL.revokeObjectURL(url);
              resolve(file);
            };
            img.src = url;
          });
        }

        function showToast(msg) {
          const t = document.createElement('div');
          t.style.cssText = 'position:fixed;bottom:24px;right:24px;background:#6366f1;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;z-index:99999;font-family:system-ui,sans-serif;box-shadow:0 4px 16px rgba(0,0,0,0.4);transition:opacity 0.3s';
          t.textContent = msg;
          document.body.appendChild(t);
          setTimeout(function() { t.style.opacity = '0'; setTimeout(function() { t.remove(); }, 300); }, 3000);
        }

        function fixBrokenPreviews() {
          document.querySelectorAll('img').forEach(function(img) {
            if (img.naturalWidth === 0 && img.src && !img.dataset.webpFixed) {
              const filename = img.src.split('/').pop().split('?')[0];
              if (previewUrls[filename]) {
                img.dataset.webpFixed = '1';
                img.src = previewUrls[filename];
              }
            }
          });
        }

        const processed = new WeakSet();
        function handleFileInput(input) {
          if (processed.has(input)) return;
          processed.add(input);
          input.addEventListener('change', async function(e) {
            const file = e.target.files && e.target.files[0];
            if (!file || !file.type.startsWith('image/')) return;
            if (file.type === 'image/webp') {
              previewUrls[file.name] = URL.createObjectURL(file);
              return;
            }
            try {
              const webpFile = await convertToWebP(file);
              const dt = new DataTransfer();
              dt.items.add(webpFile);
              const setter = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'files').set;
              setter.call(input, dt.files);
              input.dispatchEvent(new Event('input', { bubbles: true }));
              input.dispatchEvent(new Event('change', { bubbles: true }));
              showToast('Converted to WebP: ' + webpFile.name);
            } catch (err) {
              console.error('WebP conversion failed:', err);
            }
          }, true);
        }

        const observer = new MutationObserver(function() {
          document.querySelectorAll('input[type="file"]').forEach(handleFileInput);
          fixBrokenPreviews();
        });
        setTimeout(function() {
          if (document.body) {
            observer.observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['src'] });
          }
        }, 500);
      })();

      // Inject intro banner
      (function() {
        const banner = document.createElement('div');
        banner.className = 'submit-intro-banner';
        banner.innerHTML = `
          <h1>Submit Your dApp to Alphland</h1>
          <p>Fill in the form below to list your project. After submission, a Pull Request will be created on GitHub for our team to review. Before you start, prepare:</p>
          <ul class="submit-intro-checklist">
            <li>Logo (512×512px, WebP)</li>
            <li>Banner (1200×400px, WebP)</li>
            <li>Preview screenshot (1200×800px)</li>
            <li>Website URL &amp; social links</li>
            <li>Short tagline (max 60 chars)</li>
            <li>Full description (2–3 sentences)</li>
          </ul>
        `;
        document.body.insertBefore(banner, document.body.firstChild);
        // Adjust CMS root margin to match actual banner height
        setTimeout(function() {
          const root = document.getElementById('nc-root');
          if (root) root.style.marginTop = banner.offsetHeight + 'px';
        }, 600);
      })();

      // Auto-confirm local backup recovery
      (function() {
        const originalConfirm = window.confirm;
        window.confirm = function(message) {
          if (message && (message.includes('local backup') || message.includes('recovered'))) {
            return true;
          }
          return originalConfirm.call(window, message);
        };
      })();

      // Redirect to new entry page
      (function() {
        const targetPath = '#/collections/dapps/new';
        function checkAndRedirect() {
          if (!window.location.hash.startsWith('#/collections/dapps/new')) {
            window.location.hash = targetPath;
          }
        }
        setTimeout(checkAndRedirect, 100);
        window.addEventListener('hashchange', function() {
          const hash = window.location.hash;
          // Allow success page to show without redirect
          if (document.querySelector('.success-overlay')) return;

          if (!hash.startsWith('#/collections/dapps/new') && !hash.startsWith('#/workflow') && !hash.startsWith('#/editorial')) {
            window.location.hash = targetPath;
          }
        });
        setTimeout(function() {
          const style = document.createElement('style');
          style.textContent = '[class*="SidebarNavList"],[class*="CollectionLabel"],nav[class*="Sidebar"] a:not([href*="new"]),a[href="#/collections/dapps"],button[class*="BackButton"],[class*="BackArrow"],[class*="EntryCard"],[class*="EntryListing"],[class*="CollectionControls"]{display:none!important}';
          document.head.appendChild(style);
        }, 500);
      })();
    </script>
  </body>
</html>
