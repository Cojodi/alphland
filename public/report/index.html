<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Report an Issue - Alphland</title>
    <style>
      [href="#/collections/reports"],
      [data-testid="list-card"],
      .css-1hwfws3,
      a[href*="#/collections/reports/"]:not([href*="/new"]) {
        display: none !important;
      }

      /* Success page styles */
      .success-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10000;
      }
      .success-card {
        background: #1e1e2e;
        border-radius: 16px;
        padding: 48px;
        max-width: 500px;
        text-align: center;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        border: 1px solid #333;
      }
      .success-icon {
        width: 80px;
        height: 80px;
        background: linear-gradient(135deg, #00c853 0%, #00e676 100%);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 24px;
      }
      .success-icon svg {
        width: 40px;
        height: 40px;
        color: white;
      }
      .success-title {
        color: #fff;
        font-size: 24px;
        font-weight: 600;
        margin-bottom: 12px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .success-message {
        color: #a0a0a0;
        font-size: 16px;
        line-height: 1.6;
        margin-bottom: 24px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .pr-link {
        display: inline-block;
        background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
        color: white;
        text-decoration: none;
        padding: 14px 28px;
        border-radius: 8px;
        font-weight: 500;
        font-size: 15px;
        transition: transform 0.2s, box-shadow 0.2s;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .pr-link:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4);
      }
      .back-link {
        display: block;
        margin-top: 20px;
        color: #6366f1;
        text-decoration: none;
        font-size: 14px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .back-link:hover {
        text-decoration: underline;
      }
      .loading-spinner {
        width: 20px;
        height: 20px;
        border: 2px solid #333;
        border-top-color: #6366f1;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto 16px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <script>
      window.CMS_MANUAL_INIT = true;
      // Store referrer for back link
      window.referrerUrl = document.referrer || '/';
      // Get dApp name from URL
      window.prefillDappName = new URLSearchParams(window.location.search).get('dapp') || '';
    </script>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

    <script>
      // Environment detection for branch selection
      const host = window.location.hostname;
      const isProduction = host === 'alph.land' || host === 'www.alph.land';
      const targetBranch = isProduction ? 'develop' : 'bounty';

      // Store report data for PR lookup
      let lastReportData = null;
      const prefillDappName = window.prefillDappName;

      CMS.init({
        config: {
          load_config_file: false,
          backend: {
            name: 'github',
            repo: 'xbabyx/alphland',
            branch: targetBranch,
            base_url: window.location.origin,
            auth_endpoint: 'api/auth',
            open_authoring: true,
            commit_messages: {
              create: 'Report: {{fields.title}} [{{fields.dapp}}]',
              update: 'Update Report: {{fields.title}} [{{fields.dapp}}]',
              openAuthoring: '{{message}}',
            },
          },
          publish_mode: 'editorial_workflow',
          media_folder: 'public/dapps',
          public_folder: '/dapps',
          collections: [
            {
              name: 'reports',
              label: 'Reports',
              label_singular: 'Report',
              folder: 'reports',
              create: true,
              slug: '{{year}}-{{month}}-{{day}}-{{slug}}',
              extension: 'md',
              format: 'frontmatter',
              editor: { preview: false },
              fields: [
                { label: 'dApp Name', name: 'dapp', widget: 'string', required: true, hint: 'Name of the dApp you are reporting about', default: prefillDappName },
                { label: 'Issue Type', name: 'issueType', widget: 'select', required: true, options: ['Security Vulnerability', 'Bug Report', 'Incorrect Information', 'Scam/Fraud', 'Broken Link', 'Other'] },
                { label: 'Title', name: 'title', widget: 'string', required: true, hint: 'Brief summary of the issue' },
                { label: 'Description', name: 'body', widget: 'text', required: true, hint: 'Detailed description of the issue' },
                { label: 'Reporter Email', name: 'email', widget: 'string', required: false, hint: 'Optional - for follow-up questions' },
                { label: 'Submission Date', name: 'date', widget: 'datetime', format: 'YYYY-MM-DDTHH:mm:ss' },
              ],
            },
          ],
        },
      });

      // Register event handlers for CMS
      CMS.registerEventListener({
        name: 'preSave',
        handler: ({ entry }) => {
          // Store report data before save
          lastReportData = entry.get('data').toJS();
          console.log('Report data:', lastReportData);
          return entry.get('data');
        },
      });

      CMS.registerEventListener({
        name: 'postSave',
        handler: ({ entry }) => {
          console.log('Report saved successfully');
          // Show success page after a short delay to ensure PR is created
          setTimeout(() => showSuccessPage(), 2000);
        },
      });

      // Function to show success page
      function showSuccessPage() {
        // Try to get GitHub username from localStorage (set by CMS)
        const authData = localStorage.getItem('netlify-cms-user');
        let username = '';
        if (authData) {
          try {
            const parsed = JSON.parse(authData);
            username = parsed.login || parsed.name || '';
          } catch (e) {}
        }

        // Get back URL
        const backUrl = window.referrerUrl || '/';

        // Create success overlay
        const overlay = document.createElement('div');
        overlay.className = 'success-overlay';
        overlay.innerHTML = `
          <div class="success-card">
            <div class="success-icon">
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
              </svg>
            </div>
            <h2 class="success-title">Report Submitted Successfully!</h2>
            <p class="success-message">
              Your report has been submitted as a Pull Request. Our team will review it shortly.
            </p>
            <div class="loading-spinner" id="pr-loading"></div>
            <div id="pr-link-container"></div>
            <a href="${backUrl}" class="back-link">← Back</a>
          </div>
        `;
        document.body.appendChild(overlay);

        // Try to find the PR
        findLatestPR(username);
      }

      // Function to find the latest PR created by the user
      async function findLatestPR(username) {
        const container = document.getElementById('pr-link-container');
        const loading = document.getElementById('pr-loading');

        try {
          // Get auth token from CMS
          const authData = localStorage.getItem('netlify-cms-user');
          let token = '';
          let userLogin = '';
          if (authData) {
            try {
              const parsed = JSON.parse(authData);
              token = parsed.token || '';
              userLogin = parsed.login || '';
            } catch (e) {}
          }

          if (token) {
            // Search for recent PRs
            const response = await fetch(
              'https://api.github.com/repos/xbabyx/alphland/pulls?state=open&sort=created&direction=desc&per_page=10',
              {
                headers: {
                  'Authorization': `token ${token}`,
                  'Accept': 'application/vnd.github.v3+json',
                },
              }
            );

            if (response.ok) {
              const prs = await response.json();
              // Find PR that matches our report (created in last 5 minutes, from user's fork)
              const recentPR = prs.find(pr => {
                const createdAt = new Date(pr.created_at);
                const now = new Date();
                const diffMinutes = (now - createdAt) / (1000 * 60);
                const isRecent = diffMinutes < 5;
                const isFromUser = pr.head && pr.head.label && pr.head.label.includes(userLogin);
                const isReport = pr.head && pr.head.ref && pr.head.ref.includes('reports/');
                return isRecent && (isFromUser || isReport);
              });

              if (recentPR) {
                loading.style.display = 'none';
                container.innerHTML = `
                  <a href="${recentPR.html_url}" target="_blank" class="pr-link">
                    View Pull Request #${recentPR.number}
                  </a>
                `;

                // Update PR body with report details if we have the data
                if (lastReportData && token) {
                  console.log('Updating PR body with:', lastReportData);
                  await updatePRBody(recentPR.number, token, lastReportData, userLogin);
                }
                return;
              }
            }
          }

          // Fallback: show link to all PRs
          loading.style.display = 'none';
          container.innerHTML = `
            <a href="https://github.com/xbabyx/alphland/pulls" target="_blank" class="pr-link">
              View All Pull Requests
            </a>
          `;
        } catch (error) {
          console.error('Error finding PR:', error);
          loading.style.display = 'none';
          container.innerHTML = `
            <a href="https://github.com/xbabyx/alphland/pulls" target="_blank" class="pr-link">
              View All Pull Requests
            </a>
          `;
        }
      }

      // Function to update PR body with report details
      async function updatePRBody(prNumber, token, reportData, userLogin) {
        try {
          const body = `## Report Details

**dApp Name:** ${reportData.dapp || 'N/A'}

**Issue Type:** ${reportData.issueType || 'N/A'}

**Title:** ${reportData.title || 'N/A'}

**Description:**
${reportData.body || 'N/A'}

**Reporter Email:** ${reportData.email || 'Not provided'}

**Submission Date:** ${reportData.date || new Date().toISOString()}

---
*This report was submitted via [Alphland Report Form](https://alph.land/report)*`;

          const response = await fetch(
            `https://api.github.com/repos/xbabyx/alphland/pulls/${prNumber}`,
            {
              method: 'PATCH',
              headers: {
                'Authorization': `token ${token}`,
                'Accept': 'application/vnd.github.v3+json',
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({ body }),
            }
          );

          if (response.ok) {
            console.log('PR body updated successfully');
          } else {
            const errorData = await response.json();
            console.error('Failed to update PR body:', errorData);
          }
        } catch (error) {
          console.error('Error updating PR body:', error);
        }
      }

      // Auto-confirm local backup recovery
      (function() {
        const originalConfirm = window.confirm;
        window.confirm = function(message) {
          if (message && (message.includes('local backup') || message.includes('recovered'))) {
            return true;
          }
          return originalConfirm.call(window, message);
        };
      })();

      // Redirect to new report page
      (function() {
        const targetPath = '#/collections/reports/new';

        function checkAndRedirect() {
          if (!window.location.hash.startsWith('#/collections/reports/new')) {
            window.location.hash = targetPath;
          }
        }
        setTimeout(checkAndRedirect, 100);

        window.addEventListener('hashchange', function() {
          const hash = window.location.hash;
          // Allow success page to show without redirect
          if (document.querySelector('.success-overlay')) return;

          if (!hash.startsWith('#/collections/reports/new') && !hash.startsWith('#/workflow') && !hash.startsWith('#/editorial')) {
            window.location.hash = targetPath;
          }
        });

        setTimeout(function() {
          const style = document.createElement('style');
          style.textContent = '[class*="SidebarNavList"],[class*="CollectionLabel"],nav[class*="Sidebar"] a:not([href*="new"]),a[href="#/collections/reports"],button[class*="BackButton"],[class*="BackArrow"],[class*="EntryCard"],[class*="EntryListing"],[class*="CollectionControls"]{display:none!important}';
          document.head.appendChild(style);
        }, 500);
      })();
    </script>
  </body>
</html>
