<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Report an Issue - Alphland</title>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <style>
      /* Hide navigation elements that allow browsing other entries */
      [href="#/collections/reports"],
      [data-testid="list-card"],
      .css-1hwfws3,
      a[href*="#/collections/reports/"]:not([href*="/new"]) {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

    <script>
      // Auto-confirm local backup recovery dialog
      (function() {
        // Override window.confirm to auto-accept backup recovery
        const originalConfirm = window.confirm;
        window.confirm = function(message) {
          // Auto-accept if this is the backup recovery prompt
          if (message && (message.includes('local backup') || message.includes('recovered'))) {
            console.log('Auto-accepting local backup recovery');
            return true;
          }
          // For other confirms, use original behavior
          return originalConfirm.call(window, message);
        };
      })();

      // Redirect to new entry page and prevent navigation elsewhere
      (function() {
        const targetPath = '#/collections/reports/new';

        // Get dappName from URL query parameter
        const urlParams = new URLSearchParams(window.location.search);
        const dappName = urlParams.get('dapp');

        // Redirect on load if not on new entry page
        function checkAndRedirect() {
          if (window.location.hash !== targetPath && !window.location.hash.startsWith('#/collections/reports/new')) {
            window.location.hash = targetPath;
          }
        }

        // Initial redirect
        setTimeout(checkAndRedirect, 100);

        // Pre-fill dappName field if available
        if (dappName) {
          setTimeout(function() {
            // Wait for CMS to load, then pre-fill the dapp field
            const checkInterval = setInterval(function() {
              const dappInput = document.querySelector('input[type="text"]');
              if (dappInput) {
                dappInput.value = dappName;
                dappInput.dispatchEvent(new Event('input', { bubbles: true }));
                clearInterval(checkInterval);
              }
            }, 500);
          }, 1000);
        }

        // Watch for hash changes and redirect back
        window.addEventListener('hashchange', function() {
          const hash = window.location.hash;
          if (!hash.startsWith('#/collections/reports/new') &&
              !hash.startsWith('#/workflow') &&
              !hash.startsWith('#/editorial')) {
            window.location.hash = targetPath;
          }
        });

        // Hide sidebar/back navigation after CMS loads
        setTimeout(function() {
          const style = document.createElement('style');
          style.textContent = `
            /* Hide sidebar collection list */
            [class*="SidebarNavList"],
            [class*="CollectionLabel"],
            nav[class*="Sidebar"] a:not([href*="new"]),
            /* Hide back button that goes to list */
            a[href="#/collections/reports"],
            button[class*="BackButton"],
            [class*="BackArrow"],
            /* Hide any entry cards/lists */
            [class*="EntryCard"],
            [class*="EntryListing"],
            /* Hide collection controls */
            [class*="CollectionControls"] {
              display: none !important;
            }
          `;
          document.head.appendChild(style);
        }, 500);
      })();

      // Netlify Identity handling
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", user => {
          if (!user) {
            window.netlifyIdentity.on("login", () => {
              const urlParams = new URLSearchParams(window.location.search);
              const dappParam = urlParams.get('dapp') ? `?dapp=${urlParams.get('dapp')}` : '';
              document.location.href = `/report/${dappParam}`;
            });
          }
        });
      }
    </script>
  </body>
</html>
