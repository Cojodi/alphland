<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Report an Issue - Alphland</title>
    <style>
      /* Hide navigation elements that allow browsing other entries */
      [href="#/collections/reports"],
      [data-testid="list-card"],
      .css-1hwfws3,
      a[href*="#/collections/reports/"]:not([href*="/new"]) {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <script>
      // Prevent auto-init so we can set app_id dynamically
      window.CMS_MANUAL_INIT = true;
    </script>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

    <script>
      // Dynamic OAuth App ID based on domain
      const appIds = {
        'www.alph.land': 'Ov23liwd5omDACDE8wyU',
        'alph.land': 'Ov23liwd5omDACDE8wyU',
      };
      const defaultAppId = 'Ov23liNGjmU69p53f6KO'; // Testing/preview
      const appId = appIds[window.location.hostname] || defaultAppId;

      // Initialize CMS with dynamic app_id
      CMS.init({
        config: {
          backend: {
            name: 'github',
            repo: 'xbabyx/alphland',
            branch: 'develop',
            auth_type: 'pkce',
            app_id: appId,
            open_authoring: true,
          },
          publish_mode: 'editorial_workflow',
          media_folder: 'public/dapps',
          public_folder: '/dapps',
          load_config_file: true, // Also load config.yml for collections
        },
      });

      // Auto-confirm local backup recovery dialog
      (function() {
        const originalConfirm = window.confirm;
        window.confirm = function(message) {
          if (message && (message.includes('local backup') || message.includes('recovered'))) {
            console.log('Auto-accepting local backup recovery');
            return true;
          }
          return originalConfirm.call(window, message);
        };
      })();

      // Redirect to new entry page and prevent navigation elsewhere
      (function() {
        const targetPath = '#/collections/reports/new';

        // Get dappName from URL query parameter
        const urlParams = new URLSearchParams(window.location.search);
        const dappName = urlParams.get('dapp');

        function checkAndRedirect() {
          if (window.location.hash !== targetPath && !window.location.hash.startsWith('#/collections/reports/new')) {
            window.location.hash = targetPath;
          }
        }

        setTimeout(checkAndRedirect, 100);

        // Pre-fill dappName field if available
        if (dappName) {
          setTimeout(function() {
            const checkInterval = setInterval(function() {
              const dappInput = document.querySelector('input[type="text"]');
              if (dappInput) {
                dappInput.value = dappName;
                dappInput.dispatchEvent(new Event('input', { bubbles: true }));
                clearInterval(checkInterval);
              }
            }, 500);
          }, 1000);
        }

        window.addEventListener('hashchange', function() {
          const hash = window.location.hash;
          if (!hash.startsWith('#/collections/reports/new') &&
              !hash.startsWith('#/workflow') &&
              !hash.startsWith('#/editorial')) {
            window.location.hash = targetPath;
          }
        });

        // Hide sidebar/back navigation after CMS loads
        setTimeout(function() {
          const style = document.createElement('style');
          style.textContent = `
            [class*="SidebarNavList"],
            [class*="CollectionLabel"],
            nav[class*="Sidebar"] a:not([href*="new"]),
            a[href="#/collections/reports"],
            button[class*="BackButton"],
            [class*="BackArrow"],
            [class*="EntryCard"],
            [class*="EntryListing"],
            [class*="CollectionControls"] {
              display: none !important;
            }
          `;
          document.head.appendChild(style);
        }, 500);
      })();
    </script>
  </body>
</html>
